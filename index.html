<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข้อสอบเภสัชกรรมไทย</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --accent:#1d4ed8; --ok:#16a34a; --bad:#dc2626;
    --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:24px; font-family:"Sarabun","Prompt","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  .wrap { max-width:760px; margin:0 auto; }
  header { text-align:center; margin-bottom:20px; }
  header h1 { margin:0 0 4px; font-size:1.7rem; }
  header p { margin:0; color:var(--muted); font-size:.95rem; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:18px; }
  .toolbar select, .toolbar button {
    font:inherit; padding:9px 14px; border:1px solid var(--border); border-radius:10px;
    background:var(--card); cursor:pointer;
  }
  .toolbar button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .stats { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 18px; text-align:center; min-width:90px; }
  .stat .num { font-size:1.4rem; font-weight:700; }
  .stat .lbl { font-size:.78rem; color:var(--muted); }
  .stat.ok .num { color:var(--ok); } .stat.bad .num { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .q-meta { color:var(--muted); font-size:.82rem; margin-bottom:8px; }
  .q-text { font-size:1.15rem; font-weight:600; margin:0 0 18px; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt {
    text-align:left; font:inherit; font-size:1rem; padding:12px 16px; border:1.5px solid var(--border);
    border-radius:12px; background:#fff; cursor:pointer; transition:.12s;
  }
  .opt:hover:not(:disabled) { border-color:var(--accent); background:#f0f5ff; }
  .opt:disabled { cursor:default; }
  .opt.correct { background:#e8f9ee; border-color:var(--ok); }
  .opt.wrong { background:#fdecec; border-color:var(--bad); }
  .opt.reveal { background:#e8f9ee; border-color:var(--ok); }
  .feedback { margin:16px 0 0; font-weight:700; font-size:1.02rem; }
  .feedback.good { color:var(--ok); } .feedback.bad { color:var(--bad); }
  .next-wrap { margin-top:16px; text-align:center; }
  .next-wrap button { font:inherit; font-size:1rem; padding:11px 26px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
  .hidden { display:none; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>คลังข้อสอบเภสัชกรรมไทย</h1>
    <p>สุ่มข้อสอบจากทั้ง 5 ชุด · <span id="total-count"></span> ข้อ</p>
  </header>

  <div class="toolbar">
    <select id="src-select" onchange="resetAndStart()">
      <option value="0">ทุกชุด</option>
      <option value="1">ชุดที่ 1</option>
      <option value="2">ชุดที่ 2</option>
      <option value="3">ชุดที่ 3</option>
      <option value="4">ชุดที่ 4</option>
      <option value="5">ชุดที่ 5</option>
    </select>
    <button class="primary" id="start-btn" onclick="startQuiz()">เริ่ม / ข้อถัดไป</button>
    <button id="shuffle-btn" onclick="resetAndStart()">สุ่มใหม่</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="st-done">0</div><div class="lbl">ทำแล้ว</div></div>
    <div class="stat ok"><div class="num" id="st-ok">0</div><div class="lbl">ถูก</div></div>
    <div class="stat bad"><div class="num" id="st-bad">0</div><div class="lbl">ผิด</div></div>
    <div class="stat"><div class="num" id="st-pct">-</div><div class="lbl">ความแม่น</div></div>
  </div>

  <div class="card hidden" id="quiz-card">
    <div class="q-meta" id="q-meta"></div>
    <p class="q-text" id="q-text"></p>
    <div class="opts" id="opts"></div>
    <p class="feedback hidden" id="feedback"></p>
    <div class="next-wrap"><button id="next-btn" onclick="startQuiz()">ข้อถัดไป ➜</button></div>
  </div>

  <footer>ข้อมูลจาก ตัวอย่างข้อสอบเล่มสีเขียว ชุดที่ 1–5</footer>
</div>

<script>
const ALL = [{"id": 1, "question": "มีการจัดตั้งกรมหมอและโรงพระโอสถ แพทย์ที่รับราชการเรียกว่า หมอหลวง หมอที่รักษาราษฎร เรียกว่า หมอ ราษฎร หรือหมอเชลยศักดิ เหตุการณ์นีเกิดในรัชกาลใด", "options": ["ก. พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก", "ข. พระบาทสมเด็จพระพุทธเลิศหล้านภาลัย", "ค. พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว", "ง. พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว", "จ. พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว"], "answer": ["ก"], "source": 1}, {"id": 2, "question": "ปฏิสังขรณ์วัดโพธาราม รวบรวมและจารึกตำรายา ฤๅษดัดตนตำราการนวดไว้ที่ศาลาราย เหตุการณ์เกิดในรัชกาลใด", "options": ["ก. พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก", "ข. พระบาทสมเด็จพระพุทธเลิศหล้านภาลัย", "ค. พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว", "ง. พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว", "จ. พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว"], "answer": ["ก"], "source": 1}, {"id": 3, "question": "กฎหมายพนักงานพระโอสถถวายเกิดขืนในสมัยใด", "options": ["ก. พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก", "ข. พระบาทสมเด็จพระพุทธเลิศหล้านภาลัย", "ค. พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว", "ง. พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว", "จ. พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว"], "answer": ["ข"], "source": 1}, {"id": 4, "question": "มีการจัดตั้งสิริราชพยาบาล มีการสอนและรักษาทั้งการแพทย์แผนตะวันตกและแผนโบราณเหตุการณ์นีเกิดขืนใน สมัยใด", "options": ["ก. พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก", "ข. พระบาทสมเด็จพระพุทธเลิศหล้านภาลัย", "ค. พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว", "ง. พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว", "จ. พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว การสูติกรรมสมัยใหม่ เกิดขึ้นสมัยใด"], "answer": ["จ"], "source": 1}, {"id": 6, "question": "รัชกาลใดมีการประกาศใช้พระราชบัญญัติการแพทย์", "options": ["ก. พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก", "ข. พระบาทสมเด็จพระพุทธเลิศหล้านภาลัย", "ค. พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว", "ง. พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว", "จ. พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว"], "answer": ["ง"], "source": 1}, {"id": 7, "question": "รัชกาลใดได้ตรากฎหมายเสนาบดีแบ่งการประกอบโรคศิลปะออกเป็น “แผนปัจจุบัน” และ “แผนโบราณ”", "options": ["ก. พระบาทสมเด็จพระพุทธ "ข. พิกัดตรีฉินทลมกา", "ค. พิกัดตรีทิพยรส", "ง. พิกัดตรีพิษจักร"], "answer": [], "source": 5}, {"id": 1522, "question": "แค้ลม แค้พิษเลือด บำรุงโลหิต แค้ปวดท้องจุกเสียด เป็นสรรพคุณของพิกัดใด", "options": ["ก. พิกัดตรีวาตะผล", "ข. พิกัดตรีสัตกุลา", "ค. พิกัดตรีปิตตะผล", "ง. พิกัดตรีพิษจักร"], "answer": [], "source": 5}];
let pool = [];
let current = null;
let score = { done:0, ok:0, bad:0 };
let lastIndex = -1;

document.getElementById('total-count').textContent = ALL.length;

function getPool() {
  const s = parseInt(document.getElementById('src-select').value, 10);
  pool = s === 0 ? ALL : ALL.filter(q => q.source === s);
}

function resetAndStart() {
  score = { done:0, ok:0, bad:0 };
  lastIndex = -1;
  updateStats();
  startQuiz();
}

function updateStats() {
  document.getElementById('st-done').textContent = score.done;
  document.getElementById('st-ok').textContent = score.ok;
  document.getElementById('st-bad').textContent = score.bad;
  document.getElementById('st-pct').textContent = score.done
    ? Math.round(score.ok / score.done * 100) + '%' : '-';
}

function startQuiz() {
  getPool();
  if (!pool.length) { alert('ไม่มีข้อสอบในชุดนี้'); return; }
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (idx === lastIndex && pool.length > 1);
  lastIndex = idx;
  current = pool[idx];

  const card = document.getElementById('quiz-card');
  card.classList.remove('hidden');
  document.getElementById('q-meta').textContent =
    'ชุดที่ ' + current.source + ' · ข้อ ' + current.id;
  document.getElementById('q-text').textContent = current.question;

  const container = document.getElementById('opts');
  container.innerHTML = '';
  current.options.forEach(optText => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = optText;
    b.onclick = () => check(b, optText.trim().charAt(0), container);
    container.appendChild(b);
  });

  const fb = document.getElementById('feedback');
  fb.classList.add('hidden');
  fb.className = 'feedback hidden';
}

function check(btn, chosen, container) {
  const answers = current.answer || [];
  const buttons = container.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');

  if (answers.includes(chosen)) {
    btn.classList.add('correct');
    fb.textContent = '✅ ถูกต้อง';
    fb.classList.add('good');
    score.ok++;
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => {
      if (answers.includes(b.textContent.trim().charAt(0))) b.classList.add('reveal');
    });
    fb.textContent = '❌ ผิด — เฉลย: ' + answers.join(', ');
    fb.classList.add('bad');
    score.bad++;
  }
  score.done++;
  updateStats();
}

startQuiz();
</script>
